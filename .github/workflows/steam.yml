name: "[CI/CD] Build and Upload to Steam"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: steam-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_NAME: Wastelanders

jobs:
  buildGame:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - StandaloneOSX
          - StandaloneLinux64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          docker system prune -af

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - uses: game-ci/unity-builder@v4
        id: buildStep
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          versioning: Tag
          buildName: ${{ env.BUILD_NAME }}

      - name: Locate build output
        id: locate
        run: |
          set -eu
          dir=$(find build -mindepth 1 -maxdepth 1 -type d -print -quit)
          [ -n "$dir" ] || { echo "::error::No build output found under build/"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Build output: $dir"
          ls -lR "$dir"

      - name: Strip folders Unity says not to ship
        run: |
          set -eu
          find "${{ steps.locate.outputs.dir }}" -depth -type d \
            \( -name '*_BurstDebugInformation_DoNotShip' \
            -o -name '*_BackUpThisFolder_ButDontShipItWithYourGame' \) \
            -exec rm -rf {} +

      - name: Restore executable bits
        run: |
          set -eu
          dir="${{ steps.locate.outputs.dir }}"
          case "${{ matrix.targetPlatform }}" in
            StandaloneLinux64)
              find "$dir" -maxdepth 1 -type f -name "${BUILD_NAME}*" -exec chmod +x {} +
              ;;
            StandaloneOSX)
              find "$dir" -type d -path '*.app/Contents/MacOS' -exec chmod -R +x {} +
              ;;
          esac

      - name: Tar build
        run: tar -cf "${{ matrix.targetPlatform }}.tar" -C "${{ steps.locate.outputs.dir }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: ${{ matrix.targetPlatform }}.tar
          retention-days: 14

  deployToSteam:
    name: Upload to Steam
    needs: buildGame
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Build-*
          path: artifacts

      - name: Unpack builds
        run: |
          set -eu
          for p in StandaloneWindows64 StandaloneOSX StandaloneLinux64; do
            mkdir -p "build/$p"
            tar -xf "artifacts/Build-$p/$p.tar" -C "build/$p"
          done
          ls -lR build/

      - name: Verify depot contents before upload
        run: |
          set -eu

          test -f "build/StandaloneWindows64/${BUILD_NAME}.exe" \
            || { echo "::error::Windows executable missing"; exit 1; }
          test -d "build/StandaloneWindows64/${BUILD_NAME}_Data" \
            || { echo "::error::Windows _Data folder missing or misnamed"; exit 1; }

          linux_bin=$(find build/StandaloneLinux64 -maxdepth 1 -type f -name "${BUILD_NAME}*" -print -quit)
          [ -n "$linux_bin" ] && [ -x "$linux_bin" ] \
            || { echo "::error::Linux executable missing or not +x"; exit 1; }

          test -d "build/StandaloneOSX/${BUILD_NAME}.app" \
            || { echo "::error::Wastelanders.app missing - launch option will break"; exit 1; }
          mac_bin=$(find build/StandaloneOSX -type f -path '*.app/Contents/MacOS/*' -print -quit)
          [ -n "$mac_bin" ] && [ -x "$mac_bin" ] \
            || { echo "::error::macOS executable missing or not +x"; exit 1; }

          echo "All three depots match the Steam launch options."

      - uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ secrets.STEAM_APP_ID }}
          buildDescription: ${{ github.ref_name }}
          rootPath: build
          depot1Path: StandaloneWindows64
          depot2Path: StandaloneOSX
          depot3Path: StandaloneLinux64
          releaseBranch: beta
